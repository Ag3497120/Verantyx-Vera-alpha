<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vera field — documents never leave this machine</title>
<style>
/* Field-software rules, not decoration.
   - system fonts only: nothing loads from anywhere
   - high contrast: a laptop on a folding table, in daylight
   - large targets: gloves, haste, a trackpad on a hard surface
   - no colour-only meaning: every state is also a word            */
:root{
  --bg:#ffffff; --ink:#111418; --ink-2:#3c444d; --ink-3:#69727c;
  --line:#c9d0d8; --line-2:#e4e9ee; --panel:#f5f7f9;
  --ok:#0b6b3a; --ok-bg:#e6f4ec;
  --warn:#8a5300; --warn-bg:#fdf1dc;
  --stop:#a11212; --stop-bg:#fbeaea;
  --pick:#0b4f9e; --pick-bg:#e8f0fb;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12161b; --ink:#f2f5f8; --ink-2:#c3ccd6; --ink-3:#8b96a2;
    --line:#39424d; --line-2:#252c34; --panel:#1a2027;
    --ok:#5fd39a; --ok-bg:#12301f; --warn:#ecb45a; --warn-bg:#332614;
    --stop:#f28b8b; --stop-bg:#331818;
    --pick:#7db3f0; --pick-bg:#14263c;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",
       "Noto Sans JP",Meiryo,system-ui,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:2px solid var(--line);padding:.6rem 1rem}
.bar{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;
  max-width:1180px;margin:0 auto}
.brand{font-weight:800;font-size:1.05rem;margin-right:.5rem;white-space:nowrap}
.brand small{display:block;font-weight:400;font-size:.72rem;color:var(--ink-3)}
nav{display:flex;flex-wrap:wrap;gap:.3rem;flex:1}
/* Words, not icons: an icon means something different in every agency. */
nav button{font:inherit;font-size:.9rem;padding:.55rem .8rem;cursor:pointer;
  background:transparent;color:var(--ink-2);border:1px solid transparent;
  border-radius:.4rem;min-height:44px}
nav button:hover{background:var(--panel)}
nav button[aria-current="true"]{background:var(--pick-bg);color:var(--pick);
  border-color:var(--pick);font-weight:700}
/* The language switch sits in the chrome, not in a settings screen: an
   operator who cannot read the interface cannot navigate to settings. */
#lang{font:inherit;font-size:.82rem;min-height:44px;padding:.4rem .7rem;
  cursor:pointer;background:transparent;color:var(--ink-2);
  border:1px solid var(--line);border-radius:.4rem;white-space:nowrap}
main{max-width:1180px;margin:0 auto;padding:1rem 1rem 5rem}
section[hidden]{display:none}
h2{font-size:1.25rem;margin:.2rem 0 .3rem}
h3{font-size:1rem}
.lede{color:var(--ink-2);font-size:.92rem;margin:0 0 1rem;max-width:66ch}
/* Guidance sits where the question is, not in a manual somebody has to find. */
.guide{background:var(--panel);border-left:4px solid var(--line);
  padding:.7rem .9rem;border-radius:0 .4rem .4rem 0;margin:0 0 1rem;
  font-size:.88rem;color:var(--ink-2);max-width:78ch}
.guide b{color:var(--ink)}
.drop{border:2px dashed var(--line);border-radius:.5rem;padding:1.6rem 1rem;
  text-align:center;background:var(--panel)}
.drop.over{border-color:var(--pick);background:var(--pick-bg)}
/* The primary action is always on screen and never behind a menu. */
.run{position:sticky;bottom:0;background:var(--bg);border-top:2px solid var(--line);
  padding:.7rem 1rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;
  margin:1rem -1rem -5rem}
button.primary{font:inherit;font-weight:700;font-size:1rem;min-height:52px;
  padding:.7rem 1.5rem;border-radius:.45rem;cursor:pointer;
  background:var(--pick);color:#fff;border:2px solid var(--pick)}
button.primary:disabled{opacity:.45;cursor:not-allowed}
button.plain{font:inherit;min-height:44px;padding:.5rem 1rem;cursor:pointer;
  background:transparent;color:var(--ink);border:1px solid var(--line);
  border-radius:.4rem}
/* Every state is named in words. A bare spinner does not say whether to wait. */
.state{font-size:.9rem;color:var(--ink-2)}
.state.busy{color:var(--pick);font-weight:700}
.tag{display:inline-block;font-size:.76rem;font-weight:700;padding:.12rem .5rem;
  border-radius:.28rem;border:1px solid currentColor;white-space:nowrap}
.t-ok{color:var(--ok);background:var(--ok-bg)}
.t-warn{color:var(--warn);background:var(--warn-bg)}
.t-stop{color:var(--stop);background:var(--stop-bg)}
.t-pick{color:var(--pick);background:var(--pick-bg)}
/* The quiet number comes before the findings, never beside them. */
.quiet{border:2px solid var(--line);border-radius:.5rem;padding:.8rem 1rem;
  margin:0 0 1rem}
.quiet.bad{border-color:var(--warn);background:var(--warn-bg)}
.big{font-size:1.5rem;font-weight:800}
.grid{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border:1px solid var(--line-2);padding:.5rem .6rem;text-align:left;
  vertical-align:top}
th{background:var(--panel);font-weight:700}
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.card{border:1px solid var(--line);border-radius:.5rem;padding:.8rem 1rem;
  margin:0 0 .7rem}
.card h3{margin:.1rem 0 .4rem}
.ev{font-size:.84rem;color:var(--ink-2);background:var(--panel);
  padding:.35rem .5rem;border-radius:.3rem;margin:.25rem 0}
input[type=search],input[type=text]{font:inherit;padding:.65rem .8rem;
  border:2px solid var(--line);border-radius:.4rem;background:var(--bg);
  color:var(--ink);width:100%;max-width:32rem;min-height:48px}
.kbd{font:inherit;font-size:.76rem;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:.25rem;padding:0 .3rem;color:var(--ink-3)}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
/* A refusal carries the procedure, not just the failure. */
.advice{border:2px solid var(--stop);background:var(--stop-bg);color:var(--ink);
  border-radius:.5rem;padding:.8rem 1rem;margin:0 0 1rem}
.advice b{color:var(--stop)}
.muted{color:var(--ink-3);font-size:.85rem}
footer{max-width:1180px;margin:0 auto;padding:0 1rem 2rem;color:var(--ink-3);
  font-size:.82rem}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><span data-t="brand"></span><small data-t="brandSub"></small></div>
    <nav id="nav">
      <button data-s="read"  aria-current="true" data-t="navRead"></button>
      <button data-s="board" data-t="navBoard"></button>
      <button data-s="find"  data-t="navFind"></button>
      <button data-s="self"  data-t="navSelf"></button>
      <button data-s="vocab" data-t="navVocab"></button>
      <button data-s="log"   data-t="navLog"></button>
      <button data-s="help"  data-t="navHelp"></button>
    </nav>
    <button id="lang" type="button"></button>
  </div>
</header>

<main>
<!-- 1 ─────────────────────────────────────────────────────────── -->
<section id="s-read">
  <h2 data-t="readH"></h2>
  <p class="lede" data-t="readLede"></p>
  <div class="guide" data-t="readGuide"></div>
  <div class="drop" id="drop">
    <p data-t="dropHint"></p>
    <input type="file" id="files" multiple>
    <p class="muted" id="picked"></p>
  </div>
  <div id="read-out"></div>
</section>

<!-- 2 ─────────────────────────────────────────────────────────── -->
<section id="s-board" hidden>
  <h2 data-t="boardH"></h2>
  <p class="lede" data-t="boardLede"></p>
  <div class="guide" data-t="boardGuide"></div>
  <div id="board-out"></div>
</section>

<!-- 3 ─────────────────────────────────────────────────────────── -->
<section id="s-find" hidden>
  <h2 data-t="findH"></h2>
  <p class="lede" data-t="findLede"></p>
  <div class="guide" data-t="findGuide"></div>
  <div class="row">
    <input type="search" id="q" autocomplete="off">
    <button class="plain" id="go" data-t="findBtn"></button>
    <span class="muted"><span class="kbd">/</span> <span data-t="findKey"></span></span>
  </div>
  <div id="find-out"></div>
</section>

<!-- 4 ─────────────────────────────────────────────────────────── -->
<section id="s-self" hidden>
  <h2 data-t="selfH"></h2>
  <p class="lede" data-t="selfLede"></p>
  <div class="guide" data-t="selfGuide"></div>
  <div id="self-out"></div>
  <div class="row" style="margin-top:.8rem">
    <button class="plain" id="loop" disabled data-t="loopBtn"></button>
    <span class="state" id="loop-state"></span>
  </div>
  <div id="loop-out"></div>
</section>

<!-- 5 ─────────────────────────────────────────────────────────── -->
<section id="s-vocab" hidden>
  <h2 data-t="vocabH"></h2>
  <p class="lede" data-t="vocabLede"></p>
  <div class="guide" data-t="vocabGuide"></div>
  <div id="vocab-out"></div>
  <h3 style="margin-top:1.4rem" data-t="lexH"></h3>
  <p class="muted" id="lex-status"></p>
  <div class="row" id="lex-row" hidden>
    <input type="text" id="lexq">
    <button class="plain" id="lexgo" data-t="lexBtn"></button>
  </div>
  <div id="lex-out"></div>
</section>

<!-- 6 ─────────────────────────────────────────────────────────── -->
<section id="s-log" hidden>
  <h2 data-t="logH"></h2>
  <p class="lede" data-t="logLede"></p>
  <div class="guide" data-t="logGuide"></div>
  <div id="log-out"></div>
</section>

<!-- help ───────────────────────────────────────────────────────── -->
<section id="s-help" hidden>
  <h2 data-t="helpH"></h2>
  <div class="guide" data-t="helpGuide"></div>
  <div class="wrap"><table id="help-tasks"></table></div>
  <h3 style="margin-top:1.4rem" data-t="helpKeysH"></h3>
  <div class="wrap"><table id="help-keys"></table></div>
  <h3 style="margin-top:1.4rem" data-t="helpStoreH"></h3>
  <p class="muted" data-t="helpStore"></p>
</section>
</main>

<div class="run">
  <button class="primary" id="run" disabled data-t="runBtn"></button>
  <span class="state" id="run-state"></span>
</div>

<footer data-t="footer"></footer>

const KEY = 'verantyx.field.lang';
function detect(){
  const list = (navigator.languages && navigator.languages.length
    ? navigator.languages : [navigator.language]).filter(Boolean);
  for (const tag of list){
    const base = String(tag).toLowerCase().split('-')[0];
    if (base === 'ja') return 'ja';
    if (base) return 'en';
  }
  return 'ja';
}
let LANG = (() => {
  try { const v = localStorage.getItem(KEY); if (v === 'ja' || v === 'en') return v; }
  catch (e) {}
  return detect();
})();
const T = k => STR[LANG][k];

const $ = s => document.querySelector(s);
const el = (t, c, x) => { const n = document.createElement(t);
  if (c) n.className = c; if (x !== undefined) n.textContent = x; return n; };
let FILES = [], STORE = {}, READY = false, LAST = null, LEX = null;

function applyLang(){
  document.documentElement.lang = LANG;
  document.title = LANG === 'ja'
    ? 'Vera 現場版 — 資料はこの機械から出ません'
    : 'Vera field — documents never leave this machine';
  for (const node of document.querySelectorAll('[data-t]')){
    const v = STR[LANG][node.dataset.t];
    if (typeof v === 'string') node.innerHTML = v;
  }
  $('#lang').textContent = T('langBtn');
  $('#q').placeholder = T('findPlaceholder');
  $('#lexq').placeholder = T('lexPlaceholder');
  $('#picked').textContent = FILES.length
    ? T('chosen')(FILES.length, FILES.map(f => f.name).join(', '))
    : T('noneChosen');
  $('#run-state').textContent = FILES.length ? T('nChosen')(FILES.length) : T('runIdle');
  renderHelp();
  /* Re-render whatever is already on screen, so switching language does not
     leave findings in the language they were produced in. */
  if (LAST) { const keep = [...document.querySelectorAll('main > section')]
                .find(s => !s.hidden)?.id.slice(2);
              render(LAST); if (keep) show(keep); }
  if (!$('#s-log').hidden) renderLog();
  lexStatus();
}

/* ── navigation: seven sections, one bar, never nested ─────────────── */
function show(name){
  for (const b of $('#nav').children)
    b.setAttribute('aria-current', String(b.dataset.s === name));
  for (const s of document.querySelectorAll('main > section'))
    s.hidden = s.id !== 's-' + name;
  if (name === 'find') setTimeout(() => $('#q').focus(), 30);
  if (name === 'log') renderLog();
}
$('#nav').addEventListener('click', e => {
  const b = e.target.closest('button'); if (b) show(b.dataset.s);
});
$('#lang').addEventListener('click', () => {
  LANG = LANG === 'ja' ? 'en' : 'ja';
  try { localStorage.setItem(KEY, LANG); } catch (e) {}
  applyLang();
});

/* ── picking documents ─────────────────────────────────────────────── */
function setFiles(list){
  FILES = [...list];
  $('#picked').textContent = FILES.length
    ? T('chosen')(FILES.length, FILES.map(f => f.name).join(', '))
    : T('noneChosen');
  $('#run').disabled = !FILES.length;
  $('#run-state').textContent = FILES.length ? T('nChosen')(FILES.length) : T('runIdle');
}
$('#files').addEventListener('change', e => setFiles(e.target.files));
const drop = $('#drop');
['dragenter','dragover'].forEach(t => drop.addEventListener(t, e => {
  e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(t => drop.addEventListener(t, e => {
  e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => setFiles(e.dataTransfer.files));

const b64 = f => new Promise(res => { const r = new FileReader();
  r.onload = () => res(String(r.result).split(',')[1] || '');
  r.readAsDataURL(f); });

async function payload(){
  const out = [];
  for (let i = 0; i < FILES.length; i++){
    $('#run-state').textContent = T('preparing')(i + 1, FILES.length);
    out.push({name: FILES[i].name, b64: await b64(FILES[i])});
  }
  return out;
}

/* ── the primary action ────────────────────────────────────────────── */
$('#run').addEventListener('click', run);
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter'){ e.preventDefault(); run(); }
  else if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)){
    e.preventDefault(); show('find');
  } else if (/^[1-6]$/.test(e.key) && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)){
    show(['read','board','find','self','vocab','log'][+e.key - 1]);
  }
});

async function post(path, body){
  const r = await fetch(path, {method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  return r.json();
}

/* A refusal carries the procedure. The server sends only the code, so the
   wording follows the chosen language like everything else. */
function advice(d){
  const box = el('div','advice');
  let msg = STR[LANG][d.verdict];
  if (typeof msg === 'function') msg = msg(d.limit_mb ?? d.config ?? '');
  box.append(el('b', null, d.verdict), document.createTextNode(' — '));
  box.append(document.createTextNode(msg || d.detail || ''));
  if (msg && d.detail) box.append(el('div','ev', d.detail));
  return box;
}

async function run(){
  if (!FILES.length) return;
  const btn = $('#run'), st = $('#run-state');
  btn.disabled = true; st.className = 'state busy';
  st.textContent = T('reading');
  try {
    const d = await post('/api/read', {files: await payload()});
    LAST = d; render(d);
  } catch (err) {
    $('#read-out').replaceChildren(
      advice({verdict:'UNKNOWN_UNREADABLE', detail: T('disconnected')}));
  } finally {
    btn.disabled = false; st.className = 'state';
    st.textContent = T('nChosen')(FILES.length);
  }
}

/* ── rendering ─────────────────────────────────────────────────────── */
function render(d){
  const out = $('#read-out'); out.replaceChildren();
  if (d.verdict !== 'ANSWER'){ out.append(advice(d)); return; }
  READY = true; STORE = d.store || {}; $('#loop').disabled = false;

  const q = d.quiet, box = el('div', 'quiet' + (q.quiet ? ' bad' : ''));
  const g = el('div','grid');
  [[T('qRead'), q.read + ' / ' + q.seen],
   [T('qCoverage'), (q.coverage*100).toFixed(1) + '%'],
   [T('qPairs'), String(q.opposable_pairs)],
   [T('qDetections'), String((d.detections||[]).length)]].forEach(([k,v]) => {
    const c = el('div'); c.append(el('div','muted',k), el('div','big',v)); g.append(c);
  });
  box.append(g);
  (q.flags || []).forEach(f => {
    const p = el('p'); p.style.margin = '.6rem 0 0';
    p.append(el('span','tag t-warn', f.code),
             document.createTextNode(' ' + (STR[LANG][f.code] || '')));
    box.append(p);
  });
  out.append(box);

  if (d.refused?.length){
    const r = el('div','card');
    r.append(el('h3', null, T('unreadable')));
    d.refused.forEach(x => r.append(
      el('div','ev', x.name + ' — ' + (STR[LANG][x.reason] || x.reason))));
    out.append(r);
  }
  out.append(el('p','muted', T('loaded')((d.accepted||[]).join(', '))));

  renderBoard(d); renderSelf(d); renderVocab(d);
  show('board');
}

function renderBoard(d){
  const out = $('#board-out'); out.replaceChildren();
  const dets = d.detections || [];
  if (dets.length){
    const c = el('div','card');
    c.append(el('h3', null, T('nFindings')(dets.length)));
    dets.forEach(x => {
      const row = el('div'); row.style.margin = '.5rem 0';
      row.append(el('span','tag t-stop', T('contested')),
                 document.createTextNode(' ' + x.topic + ' / ' + x.aspect));
      (x.evidence || []).forEach(e => row.append(el('div','ev', e)));
      c.append(row);
    });
    out.append(c);
  }
  (d.board || []).forEach(b => {
    if (!b.disputed.length && !b.updated.length) return;
    const c = el('div','card'); c.append(el('h3', null, b.core));
    b.disputed.forEach(e => {
      const p = el('div'); p.append(el('span','tag t-stop', T('contested')));
      p.append(document.createTextNode(' ' + e.sides.map(s =>
        s.claim + ' (' + (s.sources.join(', ') || T('noSources')) + ')').join(' / ')));
      c.append(p);
    });
    b.updated.forEach(e => {
      const p = el('div'); p.append(el('span','tag t-pick', T('updated')));
      p.append(document.createTextNode(' ' + T('nowIs')(
        e.current.claim, e.current.sources.join(', '), e.current.when)));
      c.append(p);
    });
    out.append(c);
  });
  if (!out.children.length) out.append(el('p','muted', T('boardEmpty')));
}

function renderSelf(d){
  const out = $('#self-out'); out.replaceChildren();
  const mk = (title, rows, cols, pick) => {
    const c = el('div','card'); c.append(el('h3', null, title));
    if (!rows.length){ c.append(el('p','muted', T('none'))); return c; }
    const w = el('div','wrap'), t = el('table'), h = el('tr');
    cols.forEach(x => h.append(el('th', null, x)));
    t.append(h);
    rows.forEach(r => { const tr = el('tr');
      pick(r).forEach(v => tr.append(el('td', null, v))); t.append(tr); });
    w.append(t); c.append(w); return c;
  };
  out.append(mk(T('proveH'), d.proven || [], T('proveCols'),
    r => [r.perturbation, r.core, r.facet, r.shape || '—']));
  out.append(mk(T('conflictH'), d.conflicts || [], T('conflictCols'),
    r => [r.core, r.facet, r.detail || '—']));
}

function renderVocab(d){
  const out = $('#vocab-out'); out.replaceChildren();
  const q = d.queue || [];
  if (!q.length){ out.append(el('p','muted', T('noCandidates'))); return; }
  q.forEach(r => {
    const c = el('div','card');
    const head = el('div','row');
    head.append(el('h3', null, r.word));
    head.append(el('span', 'tag ' + (r.state === 'verified' ? 't-ok' : 't-warn'),
      r.state === 'verified' ? T('verified') : T('unverified')));
    c.append(head);
    c.append(el('div', null, T('guessed')(r.aspect,
      r.polarity === '+' ? T('sideCleared') : T('sideHeld'), r.anchor)));
    c.append(el('div','muted', r.why + (r.sources?.length
      ? ' — ' + T('sources') + ': ' + r.sources.join(', ') : '')));
    if (r.state_likeness !== undefined)
      c.append(el('div','muted', T('likeness')(r.state_likeness.toFixed(3))));
    (r.shapes || []).slice(0,2).forEach(s => c.append(el('div','ev', s)));
    const row = el('div','row'); row.style.marginTop = '.5rem';
    const yes = el('button','plain', T('approve'));
    const no  = el('button','plain', T('refuse'));
    const st  = el('span','state');
    yes.onclick = () => judge(r.word, 'accept', st, row);
    no.onclick  = () => judge(r.word, 'refuse', st, row);
    row.append(yes, no, st); c.append(row);
    out.append(c);
  });
}

async function judge(word, verdict, st, row){
  st.className = 'state busy'; st.textContent = T('saving');
  const d = await post('/api/decide', {word, verdict});
  st.className = 'state';
  if (d.verdict !== 'ANSWER'){ st.textContent = T('saveFailed'); return; }
  row.querySelectorAll('button').forEach(b => b.disabled = true);
  st.textContent = d.status === 'accepted' ? T('savedAccept') : T('savedRefuse');
}

/* ── search ────────────────────────────────────────────────────────── */
async function find(){
  const q = $('#q').value.trim(), out = $('#find-out');
  out.replaceChildren();
  if (!READY){ out.append(el('p','muted', T('findFirst'))); return; }
  if (!q) return;
  const d = await post('/api/search', {store: STORE, q});
  if (!d.hits.length){ out.append(el('p','muted', T('findNone')(q))); return; }
  d.hits.forEach(h => {
    const c = el('div','card'); c.append(el('h3', null, h.core));
    if (!h.claims.length) c.append(el('p','muted', T('noState')));
    h.claims.forEach(cl => {
      const p = el('div');
      p.append(el('span', 'tag ' + (cl.pole === '+' ? 't-ok' : 't-stop'),
        cl.aspect + ': ' + cl.value));
      c.append(p);
      if (cl.evidence) c.append(el('div','ev', cl.evidence));
    });
    out.append(c);
  });
}
$('#go').addEventListener('click', find);
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') find(); });

/* ── the loop ──────────────────────────────────────────────────────── */
$('#loop').addEventListener('click', async () => {
  const st = $('#loop-state'), out = $('#loop-out');
  st.className = 'state busy'; st.textContent = T('loopBusy');
  out.replaceChildren();
  const d = await post('/api/loop', {files: await payload()});
  st.className = 'state'; st.textContent = '';
  if (d.verdict !== 'ANSWER'){ out.append(advice(d)); return; }
  if (!d.repairs.length){ out.append(el('p','muted', T('loopNone'))); return; }
  const c = el('div','card'); c.append(el('h3', null, T('loopH')));
  d.repairs.forEach(r => {
    const p = el('div'); p.style.margin = '.5rem 0';
    p.append(el('span','tag ' + (r.accepted ? 't-ok' : 't-warn'),
      r.accepted ? T('accepted') : T('rejected')));
    p.append(document.createTextNode(' ' + r.candidate + ' — ' + r.reason));
    c.append(p);
  });
  c.append(el('p','muted', T('loopNote')));
  out.append(c);
});

/* ── the shift log ─────────────────────────────────────────────────── */
async function renderLog(){
  const out = $('#log-out'); out.replaceChildren();
  const d = await (await fetch('/api/sessions')).json();
  const rows = d.sessions || [];
  if (!rows.length){ out.append(el('p','muted', T('logEmpty'))); return; }
  const ZONE = {front:['zoneFront','t-pick'], recent:['zoneRecent','t-ok'],
                archive:['zoneArchive','t-warn']};
  rows.forEach((s, i) => {
    const c = el('div','card');
    const head = el('div','row');
    const [zk, zc] = ZONE[s.zone] || ['zoneArchive','t-warn'];
    head.append(el('span','tag ' + zc, T(zk)));
    head.append(el('b', null, (s.updated || '').replace('T',' ')));
    head.append(el('span','muted', s.label || (s.documents||[]).join(', ')));
    c.append(head);
    c.append(el('div','muted', T('logStat')(
      s.coverage != null ? (s.coverage*100).toFixed(1)+'%' : '—',
      (s.detections||[]).length)));
    (s.detections || []).forEach(x => {
      const p = el('div');
      p.append(el('span','tag t-stop', T('contested')),
               document.createTextNode(' ' + x.topic + ' / ' + x.aspect));
      c.append(p);
      (x.evidence || []).slice(0,2).forEach(e => c.append(el('div','ev', e)));
    });
    /* Only the newest record takes a note: that is where the next person
       looks, and a handover edited after the fact has stopped being one. */
    if (s.note) c.append(el('div','ev', T('notePrefix') + s.note));
    if (i === 0){
      const row = el('div','row'); row.style.marginTop = '.5rem';
      const ta = el('input'); ta.type = 'text';
      ta.placeholder = T('notePlaceholder'); ta.value = s.note || '';
      const btn = el('button','plain', T('save'));
      const st = el('span','state');
      btn.onclick = async () => {
        st.className = 'state busy'; st.textContent = T('savingNote');
        const r = await post('/api/note', {session_id: s.session_id, note: ta.value});
        st.className = 'state';
        st.textContent = r.verdict === 'ANSWER' ? T('savedNote') : T('saveNoteFailed');
      };
      row.append(ta, btn, st); c.append(row);
    }
    out.append(c);
  });
}

/* ── help tables ───────────────────────────────────────────────────── */
function renderHelp(){
  const mk = (node, cols, rows) => {
    node.replaceChildren();
    if (cols){ const h = el('tr'); cols.forEach(c => h.append(el('th', null, c))); node.append(h); }
    rows.forEach(r => { const tr = el('tr');
      r.forEach((c, i) => { const td = el('td', null, c);
        if (i === 0) td.style.width = '13rem'; tr.append(td); });
      node.append(tr); });
  };
  mk($('#help-tasks'), T('helpTaskCols'), T('helpTasks'));
  mk($('#help-keys'), null, T('helpKeys'));
}

/* ── lexicon (optional) ────────────────────────────────────────────── */
async function lexStatus(){
  if (!LEX) LEX = await (await fetch('/api/lexicon-status')).json();
  $('#lex-status').textContent = LEX.loaded ? T('lexOn') : T('lexOff')(LEX.config);
  $('#lex-row').hidden = !LEX.loaded;
}
$('#lexgo').addEventListener('click', async () => {
  const d = await post('/api/lexicon', {words: $('#lexq').value});
  const out = $('#lex-out'); out.replaceChildren();
  if (d.verdict !== 'ANSWER'){ out.append(advice(d)); return; }
  const w = el('div','wrap'), t = el('table'), h = el('tr');
  T('lexCols').forEach(x => h.append(el('th', null, x)));
  t.append(h);
  d.words.forEach(x => { const tr = el('tr');
    tr.append(el('td', null, x.word));
    tr.append(el('td', null, x.state_likeness === null ? '—' : x.state_likeness.toFixed(4)));
    tr.append(el('td', null, (x.nearest||[]).map(n => n[0]+'('+n[1]+')').join(', ')));
    t.append(tr); });
  w.append(t); out.append(w);
});

applyLang();
</script>
